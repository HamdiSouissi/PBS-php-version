# =============================================================================
# Prime Business Suite — orchestration Docker (Windows Docker Desktop & Linux)
#
# Démarrage :
#   cp .env.example .env        # puis ajuster DB_PASSWORD, APP_KEY…
#   docker compose up -d --build
#   http://localhost:8080
#
# Redis (facultatif, cache/queue) :
#   docker compose --profile redis up -d --build
# =============================================================================
services:
  db:
    image: postgres:18-alpine
    container_name: pbs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pbs}
      POSTGRES_USER: ${DB_USERNAME:-pbs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changez_moi}
      TZ: Europe/Paris
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pbs} -d ${DB_DATABASE:-pbs}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pbs-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pbs-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      QUEUE_DRIVER: ${QUEUE_DRIVER:-file}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Code source en montage lié pour le développement ; en production,
      # le code est déjà dans l'image (supprimer ce montage, voir docs/05).
      - ./:/var/www/pbs
      # Volume anonyme : préserve le vendor/ installé dans l'image, que le
      # bind mount sinon masquerait (l'hôte n'a pas de vendor/).
      - /var/www/pbs/vendor
      # Données générées persistantes (bulletins, exports, e-facturation…).
      - storage:/var/www/pbs/storage
    networks:
      - pbs-net

  nginx:
    image: nginx:1.27-alpine
    container_name: pbs-nginx
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    depends_on:
      # Nginx n'accepte le trafic qu'une fois PHP-FPM sain (migrations incluses),
      # ce qui évite les 502 pendant le démarrage de l'applicatif.
      app:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/pbs/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s
    networks:
      - pbs-net

  # Service facultatif : activé avec --profile redis.
  # L'application fonctionne entièrement sans lui (cache et queue fichiers).
  redis:
    image: redis:7-alpine
    container_name: pbs-redis
    restart: unless-stopped
    profiles:
      - redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - pbs-net

networks:
  pbs-net:
    driver: bridge

volumes:
  pgdata:
  storage:
  redisdata:
