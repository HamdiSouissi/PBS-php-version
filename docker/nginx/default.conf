# =============================================================================
# Prime Business Suite — vhost Nginx (PHP-FPM en amont, front controller unique)
# =============================================================================
upstream pbs_php_fpm {
    server app:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/pbs/public;
    index index.php;

    # Taille max des pièces jointes / imports (cohérente avec php.ini).
    client_max_body_size 25m;

    # En-têtes de sécurité de base (le middleware PHP en ajoute d'autres).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Journaux vers stdout/stderr (captés par Docker).
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Sonde de vivacité sans écriture en session.
    location = /health {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Fichiers statiques servis directement par Nginx.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Toutes les autres requêtes passent par le front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aucun accès aux fichiers PHP hors /public.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass pbs_php_fpm;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Interdiction d'exposer les fichiers cachés (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }
}
